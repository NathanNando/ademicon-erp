<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar conta | ERP Ademicon</title>
  <link rel="icon" href="img/Logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,800&family=Khand:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-pagina="cadastro" class="auth">
  <main class="auth__layout">

    <section class="auth__lateral">
      <img class="auth__logo" src="img/Logo.png" alt="Logotipo do sistema" width="158" height="158">
      <p class="auth__frase">“Bem-vindo, crie sua conta para poder continuar”</p>
    </section>

    <section class="auth__painel">
      <div class="auth__avatar" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20.5c0-4 3.4-6.2 7.5-6.2s7.5 2.2 7.5 6.2"/></svg>
      </div>

      <form id="form-cadastro" class="auth__form" novalidate>
        <h1 class="sr-only">Criar conta</h1>
        <div id="mensagem" class="msg" hidden role="alert"></div>

        <div class="campo">
          <label for="nome">Nome</label>
          <input id="nome" name="nome" type="text" autocomplete="name" placeholder="Nome completo" required>
        </div>

        <div class="campo">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="seu@email.com" required>
        </div>

        <div class="campo">
          <label for="senha">Senha</label>
          <div class="campo__senha">
            <input id="senha" name="senha" type="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres" required minlength="8">
            <button type="button" class="campo__alternar" data-alternar-senha="senha" aria-label="Mostrar senha" aria-pressed="false">Mostrar</button>
          </div>
        </div>

        <div class="campo">
          <label for="confirma">Confirma senha</label>
          <div class="campo__senha">
            <input id="confirma" name="confirma" type="password" autocomplete="new-password" placeholder="Repita a senha" required>
            <button type="button" class="campo__alternar" data-alternar-senha="confirma" aria-label="Mostrar senha" aria-pressed="false">Mostrar</button>
          </div>
        </div>

        <div class="auth__botoes">
          <button type="submit" id="btn-cadastrar" class="btn btn--escuro">Cadastrar</button>
          <a href="login.html" class="btn btn--escuro">Já tenho conta</a>
        </div>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
